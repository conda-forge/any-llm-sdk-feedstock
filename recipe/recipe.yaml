context:
  version: "1.27.0"

package:
  name: any-llm-sdk
  version: ${{ version }}

source:
  - url: https://pypi.org/packages/source/a/any-llm-sdk/any_llm_sdk-${{ version }}.tar.gz
    sha256: 9e18f1c270c2f0a125b209e5f975c5396d81f838f87bc9d98da240397d56e3ed 

build:
  number: 0
  script: ${{ PYTHON }} -m pip install .
  noarch: python

requirements:
  host:
    - python ${{ python_min }}.*
    - setuptools >=48
    - pip
  run:
    - python >=${{ python_min }}
    - pydantic >2,<3
    - openai >=2.18.0
    - openresponses-types >=2.4.0,<3
    - anthropic >=0.119.0
    - rich
    - httpx
    - typing-extensions >=4.5.0

tests:
  - python:
      python_version: ${{ python_min }}.*
      imports:
        - any_llm
      pip_check: true

about:
  homepage: https://github.com/mozilla-ai/any-llm
  summary: Communicate with an LLM provider using a single interface
  license: Apache-2.0
  license_file: LICENSE
  documentation: https://mozilla-ai.github.io/any-llm/

extra:
  recipe-maintainers:
    - moritzwilksch
